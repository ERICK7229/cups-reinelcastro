const q=document.getElementById('q'),cat=document.getElementById('cat'),sort=document.getElementById('sort'),results=document.getElementById('results'),count=document.getElementById('count'),favCount=document.getElementById('favCount');
const favs=new Set(JSON.parse(localStorage.getItem('cups_favs')||'[]'));
const cats=[...new Set(DATA.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function saveFavs(){localStorage.setItem('cups_favs',JSON.stringify([...favs]))}
function key(x){return x.categoria+'|'+x.servicio+'|'+x.cups}
function copyText(text,btn){if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{let old=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=old,1000)})}else alert('CUPS: '+text)}
function render(){
 let term=q.value.trim().toLowerCase(),c=cat.value;
 let arr=DATA.filter(x=>{let hay=(x.cups+' '+x.servicio+' '+x.categoria).toLowerCase();return(!term||hay.includes(term))&&(!c||x.categoria===c)});
 if(sort.value==='name')arr.sort((a,b)=>a.servicio.localeCompare(b.servicio,'es'));
 if(sort.value==='code')arr.sort((a,b)=>a.cups.localeCompare(b.cups,'es'));
 if(sort.value==='category')arr.sort((a,b)=>(a.categoria+a.servicio).localeCompare(b.categoria+b.servicio,'es'));
 count.textContent=arr.length+' resultado'+(arr.length===1?'':'s');favCount.textContent=favs.size+' favorito'+(favs.size===1?'':'s');
 if(!arr.length){results.innerHTML='<div class="empty">No encontré CUPS con esos filtros.<br>Prueba otra palabra o código.</div>';return}
 results.innerHTML=arr.map(x=>{let k=key(x),on=favs.has(k);return `<article class="card"><div class="cups">${x.cups}</div><div class="svc">${x.servicio}</div><span class="badge">${x.categoria||'Sin categoría'}</span><div class="actions"><button class="copy" onclick='copyText(${JSON.stringify(x.cups)},this)'>📋 Copiar CUPS</button><button class="fav ${on?'on':''}" onclick='toggleFav(${JSON.stringify(k)})'>${on?'★ Favorito':'☆ Favorito'}</button></div></article>`}).join('')
}
function toggleFav(k){favs.has(k)?favs.delete(k):favs.add(k);saveFavs();render()}
q.addEventListener('input',render);cat.addEventListener('change',render);sort.addEventListener('change',render);render();
