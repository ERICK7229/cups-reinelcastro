<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>CUPS Médico</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#173042;--muted:#64748b;--accent:#0f766e;--border:#dbe4e8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
h1{margin:0;font-size:25px}
.sub{opacity:.9;font-size:13px;margin-top:5px}
.wrap{max-width:1000px;margin:auto;padding:14px}
.controls{background:var(--card);padding:14px;border-radius:16px;box-shadow:0 2px 12px #0000000b;margin-bottom:14px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:#fff;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:10px 2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000008}
.cups{font-size:22px;font-weight:800;color:var(--accent)}
.svc{font-size:16px;font-weight:700;margin-top:5px}
.badge{display:inline-block;background:#e6f5f3;color:#0f766e;padding:5px 8px;border-radius:999px;font-size:11px;margin-top:9px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:650}
.copy{background:#0f766e;color:#fff}
.fav{background:#eef2f4;color:#334155}
.fav.on{background:#fff3c4;color:#7a5b00}
.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.doctor{margin-top:6px;font-size:1rem;font-weight:600;opacity:.97}
.countbox{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px}h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>🩺 CUPS Médico</h1>
    <div class="doctor">Dr. Reinel Castro Muñoz: Esp en Salud Ocupacional</div>
    <div class="sub">Buscador rápido de CUPS, procedimientos, diagnósticos y especialidades</div>
  </div>
</header>

<main class="wrap">
<section class="controls">
  <input id="q" placeholder="🔎 Buscar por código, procedimiento o especialidad..." autocomplete="off">
  <div class="grid">
    <select id="cat"><option value="">Todas las categorías</option></select>
    <select id="sort">
      <option value="relevance">Más relevantes</option>
      <option value="name">Nombre A-Z</option>
      <option value="code">Código</option>
      <option value="category">Categoría</option>
    </select>
  </div>
  <div class="stats">
    <span id="count"></span>
    <span id="favCount"></span>
  </div>
  <div class="countbox">Base actualizada desde el Excel enviado · 123 registros únicos</div>
</section>
<section id="results"></section>
</main>

<script>

icio": "CARPOGRAMA", "cups": "873004"}, {"categoria": "PROCEDIMIENTO", "servicio": "IMPEDANCIOMETRIA", "cups": "954302"}, {"categoria": "PROCEDIMIENTO", "servicio": "AUDIOMETRÍA TONAL", "cups": "954107"}, {"categoria": "PROCEDIMIENTO", "servicio": "NASOFIBROLARINGO COPIA", "cups": "314200"}, {"categoria": "PROCEDIMIENTO", "servicio": "LOGOAUDIOMETRÍA", "cups": "954401"}, {"categoria": "PROCEDIMIENTO", "servicio": "RX CODO", "cups": "873205"}, {"categoria": "PROCEDIMIENTO", "servicio": "ECOGRAFÍA DE CUELLO TEJIDOS BLANDOS", "cups": "881132"}, {"categoria": "PROCEDIMIENTO", "servicio": "ECOGRAFÍA TEJIDOS BLANDOS (EXTREMIDADES)", "cups": "881601"}, {"categoria": "PROCEDIMIENTO", "servicio": "ELECTROMIOGRAFÍA CON NEUROCONDUCCIÓN", "cups": "903860"}, {"categoria": "PROCEDIMIENTO", "servicio": "ECO PÉLVICA GINECOLÓGICA", "cups": "881401"}, {"categoria": "PROCEDIMIENTO", "servicio": "LAVADO DE OÍDOS", "cups": "905201"}, {"categoria": "PROCEDIMIENTO", "servicio": "NEUROCONDUCCION", "cups": "891508"}, {"categoria": "ESPECIALIDAD", "servicio": "ALERGOLOGÍA", "cups": "890225"}, {"categoria": "ESPECIALIDAD", "servicio": "DERMATOLOGÍA", "cups": "890242"}, {"categoria": "ESPECIALIDAD", "servicio": "UROLOGÍA", "cups": "890294"}, {"categoria": "ESPECIALIDAD", "servicio": "NEUROCIRUGÍA", "cups": "890273"}, {"categoria": "ESPECIALIDAD", "servicio": "MEDICINA INTERNA", "cups": "890266"}, {"categoria": "ESPECIALIDAD", "servicio": "CIRUGÍA GENERAL", "cups": "890235"}, {"categoria": "ESPECIALIDAD", "servicio": "CABEZA Y CUELLO", "cups": "890231"}, {"categoria": "ESPECIALIDAD", "servicio": "GINECOLOGÍA", "cups": "890250"}, {"categoria": "ESPECIALIDAD", "servicio": "OFTALMOLOGÍA", "cups": "890276"}, {"categoria": "ESPECIALIDAD", "servicio": "TOXICOLOGÍA", "cups": "890491"}, {"categoria": "ESPECIALIDAD", "servicio": "CARDIOLOGÍA", "cups": "890228"}, {"categoria": "ESPECIALIDAD", "servicio": "ORTOPEDIA", "cups": "890280"}, {"categoria": "ESPECIALIDAD", "servicio": "REUMATOLOGÍA", "cups": "89 const q=document.getElementById('q');
const cat=document.getElementById('cat');
const sort=document.getElementById('sort');
const results=document.getElementById('results');
const count=document.getElementById('count');
const favCount=document.getElementById('favCount');

const favs=new Set(JSON.parse(localStorage.getItem('cups_favs')||'[]'));

const cats=[...new Set(DATA.map(x=>x.categoria).filter(Boolean))]
  .sort((a,b)=>a.localeCompare(b,'es'));
cats.forEach(c=>{
  const o=document.createElement('option');
  o.value=c;o.textContent=c;cat.appendChild(o);
});

function saveFavs(){
  localStorage.setItem('cups_favs',JSON.stringify([...favs]));
}
function key(x){return x.categoria+'|'+x.servicio+'|'+x.cups}

function copyText(text,btn){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      const old=btn.textContent;
      btn.textContent='✓ Copiado';
      setTimeout(()=>btn.textContent=old,1000);
    });
  } else {
    alert('CUPS: '+text);
  }
}

function toggleFav(k){
  favs.has(k)?favs.delete(k):favs.add(k);
  saveFavs();
  render();
}

function render(){
  const term=q.value.trim().toLowerCase();
  const c=cat.value;

  let arr=DATA.filter(x=>{
    const hay=(x.cups+' '+x.servicio+' '+x.categoria).toLowerCase();
    return (!term||hay.includes(term)) && (!c||x.categoria===c);
  });

  if(sort.value==='name') arr.sort((a,b)=>a.servicio.localeCompare(b.servicio,'es'));
  if(sort.value==='code') arr.sort((a,b)=>a.cups.localeCompare(b.cups,'es'));
  if(sort.value==='category') arr.sort((a,b)=>(a.categoria+a.servicio).localeCompare(b.categoria+b.servicio,'es'));

  count.textContent=arr.length+' resultado'+(arr.length===1?'':'s');
  favCount.textContent=favs.size+' favorito'+(favs.size===1?'':'s');

  if(!arr.length){
    results.innerHTML='<div class="empty">No encontré CUPS con esos filtros.<br>Prueba otra palabra o código.</div>';
    return;
  }

  results.innerHTML=arr.map(x=>{
    const k=key(x),on=favs.has(k);
    return `<article class="card">
      <div class="cups">${escapeHtml(x.cups)}</div>
      <div class="svc">${escapeHtml(x.servicio)}</div>
      <span class="badge">${escapeHtml(x.categoria||'Sin categoría')}</span>
      <div class="actions">
        <button class="copy" onclick='copyText(${JSON.stringify(x.cups)},this)'>📋 Copiar CUPS</button>
        <button class="fav ${on?'on':''}" onclick='toggleFav(${JSON.stringify(k)})'>${on?'★ Favorito':'☆ Favorito'}</button>
      </div>
    </article>`;
  }).join('');
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

q.addEventListener('input',render);
cat.addEventListener('change',render);
sort.addEventListener('change',render);
render();
</script>
</body>
</html>
